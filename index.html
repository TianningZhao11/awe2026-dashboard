<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>AWE 2026 技术图谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header-actions { display: flex; gap: 12px; }
        .icon-btn {
            width: 36px; height: 36px;
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #graph-container {
            position: fixed;
            top: 56px; left: 0; right: 0; bottom: 180px;
            background: #fafafa;
            overflow: hidden;
        }
        
        .voice-panel {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 180px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .voice-btn {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #ff4d4f;
            border: none;
            color: white;
            font-size: 32px; /* 方块符号更大 */
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,77,79,0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .voice-btn:active { transform: scale(0.95); }
        .voice-btn.recording {
            background: #ff7875;
            animation: pulse 2s infinite;
        }
        .voice-btn.recording::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ff4d4f;
            animation: ripple 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255,77,79,0.4); }
            70% { box-shadow: 0 0 0 20px rgba(255,77,79,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,77,79,0); }
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        
        .voice-hint {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: flex-end;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            width: 100%;
            max-height: 70vh;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .transcript-box {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
            min-height: 60px;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tag {
            background: #e6f7ff;
            color: #1890ff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            border: 1px solid #91d5ff;
        }
        .tag.loading { opacity: 0.6; }
        
        .action-btns {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary { background: #1a1a1a; color: white; }
        .btn-secondary { background: #f5f5f5; color: #666; }
        
        .settings {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 300;
            padding: 20px;
        }
        .settings.active { display: block; }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .sidebar {
            position: fixed;
            top: 0; right: -100%;
            width: 85%;
            max-width: 400px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            z-index: 150;
            transition: right 0.3s;
            overflow-y: auto;
            padding: 20px;
        }
        .sidebar.active { right: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AWE 2026 技术图谱</h1>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
            <button class="icon-btn" onclick="exportData()">📤</button>
        </div>
    </div>

    <div id="graph-container">
        <svg id="graph-svg" width="100%" height="100%"></svg>
    </div>

    <div class="voice-panel">
        <button class="voice-btn" id="voiceBtn">🎤</button>
        <div class="voice-hint" id="voiceHint">点击开始录音</div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>确认录入</h3>
                <button onclick="closeModal()" style="background:none;border:none;font-size:20px;">✕</button>
            </div>
            <div class="transcript-box" id="transcriptText">正在转写...</div>
            <div class="tags-container" id="tagsContainer"></div>
            <div class="action-btns">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveNode()">保存到图谱</button>
            </div>
        </div>
    </div>

    <div class="settings" id="settingsPanel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;">
            <h2>设置</h2>
            <button onclick="toggleSettings()" style="background:none;border:none;font-size:24px;">✕</button>
        </div>
        <div class="input-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="apiKey" placeholder="sk-..." onchange="saveSettings()">
            <small style="color:#999;display:block;margin-top:4px;">仅保存在本地浏览器</small>
        </div>
        <div class="input-group">
            <label>代理地址</label>
            <input type="text" id="proxyUrl" placeholder="https://your-worker.workers.dev" onchange="saveSettings()">
            <small style="color:#999;display:block;margin-top:4px;">Cloudflare Worker地址</small>
        </div>
        <button class="btn btn-primary" onclick="toggleSettings()" style="margin-top:20px;">保存并关闭</button>
    </div>

    <div class="sidebar" id="nodeSidebar"></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        // 全局状态
        let nodes = JSON.parse(localStorage.getItem('awe_nodes') || '[]');
        let links = JSON.parse(localStorage.getItem('awe_links') || '[]');
        let currentTranscript = '';
        let currentTags = [];
        let recognition = null;
        let isRecording = false;

        // 初始化语音识别（简化版）
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别');
                return null;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.continuous = true;
            rec.interimResults = true;
            
            let finalTranscript = '';
            let interimTranscript = '';
            
            rec.onstart = () => {
                console.log('录音开始');
                isRecording = true;
                finalTranscript = '';
                interimTranscript = '';
                
                const btn = document.getElementById('voiceBtn');
                btn.classList.add('recording');
                btn.innerHTML = '◼';
                
                document.getElementById('voiceHint').textContent = '正在聆听，点击方块停止';
                document.getElementById('transcriptText').textContent = "正在聆听...";
                
                if (navigator.vibrate) navigator.vibrate(50);
            };
            
            rec.onresult = (event) => {
                interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }
                const displayText = finalTranscript + interimTranscript;
                document.getElementById('transcriptText').textContent = displayText || "正在聆听...";
            };
            
            rec.onerror = (event) => {
                console.log('录音错误:', event.error);
                // 忽略 aborted 错误（用户停止或iOS自动中断）
                if (event.error === 'aborted' && !isRecording) return;
                
                if (event.error === 'not-allowed') {
                    alert('请允许麦克风权限');
                    stopRecording();
                }
            };
            
            rec.onend = () => {
                console.log('录音结束');
                // 如果是异常结束且还在录音状态，尝试重启
                if (isRecording) {
                    setTimeout(() => {
                        try { rec.start(); } catch(e) { stopRecording(); }
                    }, 100);
                } else {
                    processRecordingResult();
                }
            };
            
            return rec;
        }

        // Toggle 录音
        function toggleRecording() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            
            if (!isRecording) {
                // 开始
                try {
                    recognition.start();
                } catch(err) {
                    // 如果已经在运行，先停再开
                    try { recognition.stop(); } catch(e){}
                    setTimeout(() => recognition.start(), 200);
                }
            } else {
                // 停止
                stopRecording();
            }
        }

        function stopRecording() {
            isRecording = false;
            try { recognition.stop(); } catch(err) {}
            
            const btn = document.getElementById('voiceBtn');
            btn.classList.remove('recording');
            btn.innerHTML = '🎤';
            document.getElementById('voiceHint').textContent = '点击开始录音';
            
            if (navigator.vibrate) navigator.vibrate([30, 50]);
        }

        function processRecordingResult() {
            const text = document.getElementById('transcriptText').textContent;
            if (text && text !== "正在聆听..." && text.length > 0) {
                currentTranscript = text;
                showConfirmModal();
            } else {
                alert('未检测到语音，请重试');
            }
        }

        // 绑定事件（仅此一处，移除HTML中的onclick）
        document.getElementById('voiceBtn').addEventListener('click', toggleRecording);

        // 其他函数保持不变...
        function initGraph() {
            const svg = d3.select("#graph-svg");
            if (!svg.node()) return;
            
            if (nodes.length === 0) {
                loadSampleData();
            }
            updateGraph();
        }

        function loadSampleData() {
            nodes = [
                {id: "海尔", group: 1, level: 4, label: "海尔智家", type: "company"},
                {id: "华为", group: 1, level: 3, label: "华为鸿蒙智家", type: "company"},
                {id: "UWB雷达", group: 2, level: 4, label: "UWB超宽带雷达", type: "tech"},
                {id: "磁控保鲜", group: 2, level: 4, label: "磁控保鲜技术", type: "tech", military: "潜艇食品保障"},
                {id: "聆思", group: 4, level: 2, label: "聆思科技", type: "company"},
                {id: "移远", group: 4, level: 2, label: "移远通信", type: "company"}
            ];
            
            links = [
                {source: "海尔", target: "UWB雷达"},
                {source: "海尔", target: "磁控保鲜"},
                {source: "聆思", target: "UWB雷达"},
                {source: "移远", target: "UWB雷达"}
            ];
            
            saveData();
        }

        function updateGraph() {
            const svg = d3.select("#graph-svg");
            svg.selectAll("*").remove();
            
            const container = svg.node().parentNode;
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2));
            
            const link = svg.append("g")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .attr("stroke", "#999")
                .attr("stroke-opacity", 0.6);
            
            const node = svg.append("g")
                .selectAll("g")
                .data(nodes)
                .enter().append("g")
                .call(d3.drag()
                    .on("start", (event, d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x; d.fy = d.y;
                    })
                    .on("drag", (event, d) => {
                        d.fx = event.x; d.fy = event.y;
                    })
                    .on("end", (event, d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null; d.fy = null;
                    }))
                .on("click", (event, d) => showNodeDetail(d));
            
            node.append("circle")
                .attr("r", d => d.type === 'company' ? 25 : 20)
                .attr("fill", d => {
                    if (d.group === 1) return "#1890ff";
                    if (d.group === 2) return "#52c41a";
                    if (d.group === 4) return "#722ed1";
                    return "#fa8c16";
                })
                .attr("stroke", "#fff")
                .attr("stroke-width", 2);
            
            node.append("text")
                .text(d => d.label)
                .attr("text-anchor", "middle")
                .attr("dy", 35)
                .attr("font-size", "12px")
                .attr("fill", "#333");
            
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });
        }

        function showConfirmModal() {
            document.getElementById('transcriptText').textContent = currentTranscript || "正在转写...";
            document.getElementById('confirmModal').classList.add('active');
            document.getElementById('tagsContainer').innerHTML = '<div class="tag loading">AI分析中...</div>';
            
            if (currentTranscript) extractTags(currentTranscript);
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.remove('active');
        }

        async function extractTags(text) {
            const apiKey = localStorage.getItem('deepseek_api_key');
            const proxyUrl = localStorage.getItem('proxy_url') || 'https://awe2026-proxy.yourusername.workers.dev';
            
            if (!apiKey) {
                document.getElementById('tagsContainer').innerHTML = 
                    '<div class="tag" style="background:#ff4d4f;color:white">请先设置API Key</div>';
                return;
            }
            
            const systemPrompt = `你是AWE 2026家电展的技术标签提取助手。从用户输入中提取技术实体，返回JSON数组格式：
识别企业：[[海尔]], [[华为]], [[聆思]], [[移远]], [[Realtek]], [[绿联]], [[影石]], [[奕斯伟]]
识别技术层级：[[Level 1 材料]], [[Level 2 芯片]], [[Level 3 组网]], [[Level 4 整机]], [[Level 5 场景]]
识别具体技术：[[UWB雷达]], [[磁控保鲜]], [[MSA氮氧智控]], [[PLC]], [[WiFi 7]], [[星闪]], [[DeepSeek]], [[AI NAS]]
识别军转民：[[军转民]]（注明来源如"潜艇技术"）
只返回JSON数组，例如：["[[海尔]]", "[[Level 4]]", "[[UWB雷达]]"]`;

            try {
                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: apiKey,
                        model: "deepseek-chat",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.3
                    })
                });
                
                const data = await response.json();
                let tags = [];
                
                if (data.choices && data.choices[0].message.content) {
                    try {
                        const content = data.choices[0].message.content;
                        const jsonMatch = content.match(/\[.*\]/);
                        if (jsonMatch) tags = JSON.parse(jsonMatch[0]);
                    } catch (e) {}
                }
                
                currentTags = tags.length > 0 ? tags : localExtractTags(text);
                renderTags(currentTags);
                
            } catch (error) {
                currentTags = localExtractTags(text);
                renderTags(currentTags);
            }
        }

        function localExtractTags(text) {
            const tags = [];
            const keywords = {
                '海尔': '[[海尔]]', '华为': '[[华为]]', 'UWB': '[[UWB雷达]]',
                '雷达': '[[毫米波雷达]]', '磁控': '[[磁控保鲜]]', 'MSA': '[[MSA氮氧智控]]',
                '聆思': '[[聆思科技]]', '移远': '[[移远通信]]', '绿联': '[[绿联]]'
            };
            
            for (let [key, tag] of Object.entries(keywords)) {
                if (text.includes(key) && !tags.includes(tag)) tags.push(tag);
            }
            if (text.includes('潜艇') || text.includes('航天')) tags.push('[[军转民]]');
            return tags;
        }

        function renderTags(tags) {
            const container = document.getElementById('tagsContainer');
            if (tags.length === 0) {
                container.innerHTML = '<div class="tag" style="background:#f5f5f5;color:#999">未识别到标签</div>';
                return;
            }
            container.innerHTML = tags.map(tag => 
                `<div class="tag">${tag.replace(/\[\[|\]\]/g, '')}</div>`
            ).join('');
        }

        function saveNode() {
            const nodeId = 'node_' + Date.now();
            const newNode = {
                id: nodeId,
                label: currentTranscript.substring(0, 20) + '...',
                content: currentTranscript,
                tags: currentTags,
                timestamp: new Date().toISOString(),
                group: 5,
                level: 4
            };
            
            nodes.push(newNode);
            
            currentTags.forEach(tag => {
                const cleanTag = tag.replace(/\[\[|\]\]/g, '');
                const existingNode = nodes.find(n => n.label === cleanTag || n.id === cleanTag);
                if (existingNode && existingNode.id !== nodeId) {
                    links.push({ source: nodeId, target: existingNode.id });
                }
            });
            
            saveData();
            updateGraph();
            closeModal();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function saveData() {
            localStorage.setItem('awe_nodes', JSON.stringify(nodes));
            localStorage.setItem('awe_links', JSON.stringify(links));
        }

        function showNodeDetail(d) {
            const sidebar = document.getElementById('nodeSidebar');
            sidebar.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2>${d.label}</h2>
                    <button onclick="document.getElementById('nodeSidebar').classList.remove('active')" style="background:none;border:none;font-size:24px;">✕</button>
                </div>
                <div style="background:#f5f5f5;padding:16px;border-radius:8px;margin-bottom:16px;">
                    <div style="font-size:12px;color:#666;margin-bottom:4px;">类型</div>
                    <div>${d.type || '未知'}</div>
                </div>
                ${d.military ? `
                <div style="background:#fff2e8;padding:16px;border-radius:8px;margin-bottom:16px;border:1px solid #ffbb96;">
                    <div style="font-size:12px;color:#fa8c16;margin-bottom:4px;">军转民来源</div>
                    <div>${d.military}</div>
                </div>
                ` : ''}
                ${d.content ? `
                <div style="margin-top:20px;">
                    <div style="font-size:12px;color:#666;margin-bottom:8px;">原始记录</div>
                    <div style="background:#f5f5f5;padding:12px;border-radius:8px;font-size:14px;">${d.content}</div>
                </div>
                ` : ''}
            `;
            sidebar.classList.add('active');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        function saveSettings() {
            const apiKey = document.getElementById('apiKey').value;
            const proxyUrl = document.getElementById('proxyUrl').value;
            if (apiKey) localStorage.setItem('deepseek_api_key', apiKey);
            if (proxyUrl) localStorage.setItem('proxy_url', proxyUrl);
        }

        function exportData() {
            const data = { nodes, links, export_time: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `AWE2026_data_${Date.now()}.json`;
            a.click();
        }

        // 初始化
        window.onload = function() {
            initGraph();
            const savedKey = localStorage.getItem('deepseek_api_key');
            const savedProxy = localStorage.getItem('proxy_url');
            if (savedKey) document.getElementById('apiKey').value = savedKey;
            if (savedProxy) document.getElementById('proxyUrl').value = savedProxy;
        };
    </script>
</body>
</html>
